name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Test Suite & Integrity Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Compile Python Packages
      run: |
        python -m compileall src tests

    - name: Run Unit & Integration Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Run Offline Benchmark Evaluation
      run: |
        python -m src.evaluation.run_evaluation --mode=offline

    - name: Check Gold Dataset Integrity
      run: |
        python scratch/verify_phase19_gold_integrity.py
